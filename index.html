  <style>
    :root {
      --primary: #f97316;
      --primary-dark: #ea580c;
      --bg: #f8fafc;
      --card-bg: #ffffff;
      --text: #0f172a;
      --text-muted: #64748b;
      --border: #e2e8f0;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: 'Poppins', sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      padding-bottom: 50px;
    }

    /* Header Nav */
    .top-navbar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: #ffffff;
      border-bottom: 1px solid var(--border);
      position: sticky;
      top: 0;
      z-index: 100;
    }

    .nav-left {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .nav-thumb {
      width: 44px;
      height: 44px;
      border-radius: 50%;
      border: 2px solid var(--primary);
      object-fit: cover;
    }

    .nav-text h1 {
      font-size: 0.98rem;
      font-weight: 700;
      color: #0f172a;
    }

    .nav-text p {
      font-size: 0.72rem;
      color: var(--primary);
      font-weight: 600;
    }

    .nav-right {
      display: flex;
      align-items: center;
      gap: 18px;
      color: #334155;
      font-size: 1.15rem;
    }

    /* Page Content Container */
    .content-box {
      max-width: 580px;
      margin: 0 auto;
      padding: 14px;
    }

    /* Hero Banner Area */
    .hero-banner {
      width: 100%;
      border-radius: 16px;
      overflow: hidden;
      margin-bottom: 14px;
      border: 1px solid var(--border);
      box-shadow: 0 4px 10px rgba(0,0,0,0.05);
    }

    .hero-banner img {
      width: 100%;
      display: block;
      height: auto;
    }

    /* Profile Badge Card */
    .profile-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);
      margin-bottom: 14px;
    }

    .profile-meta {
      display: flex;
      align-items: center;
      gap: 16px;
    }

    .avatar-large {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      border: 3px solid var(--primary);
      object-fit: cover;
      background: #fff7ed;
      flex-shrink: 0;
    }

    .profile-titles h2 {
      font-size: 1.25rem;
      font-weight: 700;
      color: #0f172a;
    }

    .badge-primary {
      color: var(--primary);
      font-size: 0.82rem;
      font-weight: 600;
      margin-top: 2px;
    }

    .sub-role {
      font-size: 0.78rem;
      color: var(--text-muted);
    }

    /* Quick Links Box */
    .links-card {
      background: var(--card-bg);
      border-radius: 16px;
      padding: 18px;
      border: 1px solid var(--border);
      box-shadow: 0 2px 8px rgba(0,0,0,0.04);

    .card-title {
      font-size: 0.95rem;
      font-weight: 600;
      color: #0f172a;
      margin-bottom: 14px;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .links-stack {
      display: flex;
      flex-direction: column;
      gap: 10px;
    }

    .social-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 12px 16px;
      border-radius: 12px;
      text-decoration: none;
      font-size: 0.9rem;
      font-weight: 500;
      color: #ffffff;
      transition: opacity 0.2s ease;
    }

    .social-row:active {
      opacity: 0.9;
    }

    .btn-left-part {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-left-part i {

    .btn-insta { background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888); }
    .btn-tw { background: #000000; }
    .btn-fb { background: #1877f2; }
    .btn-yt { background: #ff0000; }
